# fly.toml — Valuation DCF B3 API
# Documentação: https://fly.io/docs/reference/configuration/

app = "valuationdcf-api"
primary_region = "gru"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
